name: Build and release mod

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hotkey-suite-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate manifest and version
        id: metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          manifest = json.loads(Path("manifest.json").read_text(encoding="utf-8"))
          version = str(manifest.get("version", ""))
          if not re.fullmatch(r"(?:0|[1-9]\d*)\.\d+\.\d+", version):
              raise SystemExit(f"manifest version is not semver: {version!r}")
          if manifest.get("id") != "hotkey_suite":
              raise SystemExit("manifest id must remain hotkey_suite")
          # The launcher reads this field to offer Update / Versions.  An
          # absent or malformed value silently disables auto-update, so it is
          # worth failing the build over.
          if manifest.get("github") != "ojsaucer/gen1recomp-hotkey-suite":
              raise SystemExit("manifest github field must point at this repo")
          Path(".release-version").write_text(version + "\n", encoding="utf-8")
          PY
          VERSION="$(cat .release-version)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "asset=hotkey_suite-$VERSION.zip" >> "$GITHUB_OUTPUT"

      - name: Cut the release notes from the changelog
        shell: bash
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          # Cut these before anything is tagged or published: a missing
          # section should fail the build, not leave a tag with no release.
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")

          # The heading the notes are cut from: "## [1.10.0] - 2026-09-20".
          # Everything up to the next "## " belongs to this version.
          pattern = re.compile(
              r"^## \[" + re.escape(version) + r"\][^\n]*\n(.*?)(?=^## |\Z)",
              re.DOTALL | re.MULTILINE,
          )
          match = pattern.search(text)
          if not match:
              raise SystemExit(
                  f"CHANGELOG.md has no '## [{version}]' section. Add one "
                  "before releasing: it is what the release notes and the "
                  "launcher's changelog are both cut from."
              )

          body = match.group(1).strip()
          if not body:
              raise SystemExit(f"the '## [{version}]' section is empty")

          Path("release-notes.md").write_text(body + "\n", encoding="utf-8")
          print(f"{len(body.splitlines())} lines of notes for {version}")
          PY

      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1

      - name: Validate Lua syntax
        shell: bash
        run: |
          # Use the real Lua 5.1 compiler rather than a JS reimplementation:
          # it is the same parser the engine will hold these files to.
          status=0
          while IFS= read -r -d '' file; do
            if ! output="$(luac5.1 -p "$file" 2>&1)"; then
              echo "::error file=${file#./}::${output}"
              status=1
            fi
          done < <(find . -name '*.lua' -not -path './.git/*' -print0)
          if [ "$status" -ne 0 ]; then
            echo "Lua syntax validation failed."
            exit 1
          fi
          echo "All Lua files parse cleanly."

      - name: Build launcher-ready archive
        shell: bash
        env:
          ASSET: ${{ steps.metadata.outputs.asset }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import zipfile
          from pathlib import Path

          asset = os.environ["ASSET"]
          source = Path(".")
          skip = {".git", ".github", "tests", ".release-version",
                  "release-notes.md"}

          paths = []
          for path in sorted(source.rglob("*")):
              if not path.is_file():
                  continue
              parts = path.relative_to(source).parts
              if parts[0] in skip:
                  continue
              paths.append(path)

          # Files land at the archive ROOT: the layout the launcher's
          # Import mod .zip / Update / Versions paths install.
          with zipfile.ZipFile(asset, "w", zipfile.ZIP_DEFLATED,
                               compresslevel=9) as archive:
              for path in paths:
                  archive.write(path, path.relative_to(source).as_posix())

          with zipfile.ZipFile(asset) as archive:
              names = set(archive.namelist())
              missing = {"manifest.json", "main.lua"} - names
              if missing:
                  raise SystemExit(f"archive is missing {sorted(missing)}")
              if any(name.startswith("tests/") for name in names):
                  raise SystemExit("archive must not ship tests/")
              if "release-notes.md" in names:
                  raise SystemExit("archive must not ship release-notes.md")
              if any("/" in name and name.split("/")[0] == "hotkey_suite"
                     for name in names):
                  raise SystemExit("archive must be flat, not nested in a folder")
              manifest = json.loads(archive.read("manifest.json"))
              expected = asset[len("hotkey_suite-"):-len(".zip")]
              if manifest.get("version") != expected:
                  raise SystemExit("archive manifest version does not match its filename")
              print(f"{asset}: {len(names)} files, flat, version {expected}")
          PY

      - name: Skip if this version is already released
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG is already released; bump manifest.json to publish a new one."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create version tag
        if: steps.check.outputs.publish == 'true'
        shell: bash
        env:
          TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          git fetch --tags --force
          if git show-ref --tags --verify --quiet "refs/tags/$TAG"; then
            echo "$TAG already exists; keeping the existing tag."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Hotkey Suite ${TAG#v}"
            git push origin "$TAG"
          fi

      - name: Create GitHub release
        if: steps.check.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.metadata.outputs.tag }}
          ASSET: ${{ steps.metadata.outputs.asset }}
        run: |
          gh release create "$TAG" "$ASSET" \
            --title "Hotkey Suite ${TAG#v}" \
            --notes-file release-notes.md
